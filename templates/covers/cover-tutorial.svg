<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="{{PRIMARY}}" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <text x="90" y="380" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="{{TITLE_SIZE}}" font-weight="bold" fill="#1a1a1a">
    {{TITLE}}
  </text>

  <text x="95" y="440" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="{{SUBTITLE_SIZE}}" font-weight="normal" fill="#333333" opacity="0.90">
    {{SUBTITLE}}
  </text>

  <image x="1240" y="230" width="560" height="560"
         xlink:href="{{ICON_PNG}}" preserveAspectRatio="xMidYMid meet"/>

  <path d="M 0,880 Q 960,820 1920,880 L 1920,1080 L 0,1080 Z"
        fill="{{PRIMARY}}" opacity="0.03"/>

  <image x="90" y="970" width="200" height="71"
         xlink:href="{{WENPAI_LOGO_PNG}}" preserveAspectRatio="xMidYMid meet"
         opacity="0.80"/>
</svg>
