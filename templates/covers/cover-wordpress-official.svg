<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{PRIMARY}}" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <text x="100" y="380" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="{{TITLE_SIZE}}" font-weight="bold" fill="#ffffff">
    {{TITLE}}
  </text>

  <text x="105" y="455" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="{{SUBTITLE_SIZE}}" font-weight="normal" fill="#ffffff" opacity="0.88">
    {{SUBTITLE}}
  </text>

  <image x="1320" y="230" width="540" height="540"
         xlink:href="{{ICON_PNG}}" preserveAspectRatio="xMidYMid meet"/>

  <image x="100" y="970" width="200" height="71"
         xlink:href="{{WENPAI_LOGO_PNG}}" preserveAspectRatio="xMidYMid meet"
         opacity="0.85"/>
</svg>
