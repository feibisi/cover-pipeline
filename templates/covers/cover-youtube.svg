<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="{{PRIMARY}}" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- 基底 -->
  <rect width="1280" height="720" fill="#fafafa"/>
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- 标题：左侧 -->
  <text x="60" y="260" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="72" font-weight="bold" fill="#1e1e1e">
    {{TITLE}}
  </text>

  <!-- 右侧大图标 -->
  <image x="820" y="180" width="360" height="360"
         xlink:href="{{ICON_PNG}}" preserveAspectRatio="xMidYMid meet"/>

  <!-- 底部装饰弧 -->
  <path d="M 0,600 Q 640,560 1280,600 L 1280,720 L 0,720 Z"
        fill="{{PRIMARY}}" opacity="0.04"/>

  <!-- 左下角 wenpai logo -->
  <image x="60" y="650" width="100" height="35"
         xlink:href="{{WENPAI_LOGO_PNG}}" preserveAspectRatio="xMidYMid meet"
         opacity="0.75"/>
</svg>
