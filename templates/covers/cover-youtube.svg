<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="{{PRIMARY}}" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- 标题区：左侧，预留安全区 -->
  <text x="60" y="270" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="{{TITLE_SIZE}}" font-weight="bold" fill="#1a1a1a">
    {{TITLE}}
  </text>

  <text x="65" y="315" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="{{SUBTITLE_SIZE}}" font-weight="normal" fill="#333333" opacity="0.90">
    {{SUBTITLE}}
  </text>

  <!-- 右侧图标 -->
  <image x="800" y="160" width="400" height="400"
         xlink:href="{{ICON_PNG}}" preserveAspectRatio="xMidYMid meet"/>

  <!-- 底部装饰弧 -->
  <path d="M 0,580 Q 640,540 1280,580 L 1280,720 L 0,720 Z"
        fill="{{PRIMARY}}" opacity="0.03"/>

  <!-- 左下角 wenpai logo -->
  <image x="60" y="640" width="150" height="53"
         xlink:href="{{WENPAI_LOGO_PNG}}" preserveAspectRatio="xMidYMid meet"
         opacity="0.80"/>
</svg>
